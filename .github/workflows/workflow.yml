name: Deploy and Run AWS Glue Job

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC authentication
  contents: read  # Required to clone the repository

jobs:
  deploy-glue:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Authenticate GitHub Actions with AWS using Role 1
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::779249081488:role/Role-github-actions-glue
          aws-region: ap-southeast-1
          audience: ://amazonaws.com

      # Step 3: Sync your Glue script from GitHub to your S3 bucket
      - name: Upload Glue Script to S3
        run: |
          aws s3 cp ./mysql_extraction.py s3://s3-small-projects/Sid-projects/glue_scripts/

      # Step 4: Deploy or Update the Glue Job, attaching Role 2 to it
      - name: Create or Update Glue Job
        run: |
          aws glue create-job \
            --name "github-deployed-glue-job" \
            --role "arn:aws:iam::779249081488:role/Role-github-actions-glue" \ # <-- ROLE 2 (Passed as text)
            --command '{"Name": "glueetl", "ScriptLocation": "s3://s3-small-projects/Sid-projects/glue_scripts/", "PythonVersion": "3"}' \
            --glue-version "4.0"

      # Step 5: (Optional) Run the Glue job immediately
      - name: Start Glue Job
        run: |
          aws glue start-job-run --job-name "github-deployed-glue-job"
